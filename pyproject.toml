[project]
name = "atelier-wardrobe"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "Django>=6.1,<6.2",
    "Pillow>=11.0,<13.0",
    "python-dotenv>=1.0,<2.0",
    "dj-database-url>=2.3,<3.0",
    "psycopg[binary]>=3.2,<4.0",
]

[tool.vercel.scripts]
build = 'if [ -z "$DATABASE_URL_UNPOOLED" ]; then echo "Connect a PostgreSQL database in Vercel before deploying."; exit 1; fi; DATABASE_URL="$DATABASE_URL_UNPOOLED" python manage.py migrate --noinput'
