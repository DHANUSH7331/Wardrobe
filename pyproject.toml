[project]
name = "atelier-wardrobe"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "Django>=6.1,<6.2",
    "Pillow>=11.0,<13.0",
    "python-dotenv>=1.0,<2.0",
    "dj-database-url>=2.3,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "vercel-blob>=0.5.0,<1.0.0",
]

[tool.vercel.scripts]
build = 'if [ -z "$DATABASE_URL" ]; then echo "Connect Prisma Postgres to this Vercel project and enable DATABASE_URL for Production."; exit 1; fi; DJANGO_DATABASE_URL="$DATABASE_URL" python manage.py migrate --noinput'
