<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#111110">
    <title>Offline — Atelier</title>
    <style>
        :root { color-scheme: dark; }
        body {
            display: grid;
            min-height: 100vh;
            place-items: center;
            margin: 0;
            padding: 24px;
            color: #f0eee9;
            background: #111110;
            font: 16px/1.7 "Segoe UI", Arial, sans-serif;
            text-align: center;
        }
        main { max-width: 440px; }
        .mark {
            display: grid;
            width: 42px;
            height: 42px;
            margin: 0 auto 28px;
            place-items: center;
            border: 1px solid #c9a982;
            border-radius: 50%;
            color: #c9a982;
            font: 24px/1 Georgia, serif;
        }
        h1 { font: 400 44px/1.1 Georgia, serif; }
        p { color: #a6a39c; }
        a { color: #c9a982; }
    </style>
</head>
<body>
    <main>
        <span class="mark" aria-hidden="true">A</span>
        <h1>You’re offline</h1>
        <p>The Atelier landing page is saved on this device. Reconnect to load the latest version.</p>
        <a href="./">Try again</a>
    </main>
</body>
</html>
